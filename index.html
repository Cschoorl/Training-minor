<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Minor</title>
<style>
  :root{ color-scheme:light dark; --ink:#F7F6F1; --text:#252B21; --dim:#69725F; --brand:#6E7C58; --line:#DBDBCE; }
  @media (prefers-color-scheme:dark){
    :root{ --ink:#171B15; --text:#ECEEE4; --dim:#97A18B; --brand:#A9B693; --line:#343B2D; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--ink); color:var(--text); padding:32px;
    font:300 17px/1.5 "Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;
  }
  main{max-width:34em}
  h1{font-size:34px; font-weight:400; letter-spacing:-.02em; margin:0 0 10px}
  p{color:var(--dim); margin:0 0 28px}
  a{
    display:inline-block; color:var(--brand); text-decoration:none;
    border:1px solid var(--line); border-radius:3px; padding:13px 20px;
    font-size:16px; transition:border-color .15s ease;
  }
  a:hover,a:focus-visible{border-color:var(--brand)}
  a:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
</style>
<main>
  <h1>Training Minor</h1>
  <p>Materiaal voor de minor-trainingen.</p>
  <a href="back-to-being/">Slidedeck: Van idee naar iets dat bestaat &rarr;</a>
</main>
